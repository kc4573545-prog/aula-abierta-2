# Blueprint de Render: un Web Service (Express sirve API + frontend) y una base PostgreSQL.
databases:
  - name: aula-abierta-db
    plan: free
    databaseName: aula_abierta
    user: aula_abierta

services:
  - type: web
    name: aula-abierta
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aula-abierta-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
